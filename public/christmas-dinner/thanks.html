<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking received | Templepatrick Christmas Dinner</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    padding: 24px 16px;
    font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    font-size: 18px; line-height: 1.5; color: #24211c;
    background: #0d1a36;
    background-image: radial-gradient(circle at 20% 0%, #24407a 0, transparent 55%), radial-gradient(circle at 90% 100%, #1f4a33 0, transparent 50%);
  }
  .card {
    max-width: 520px; text-align: center;
    background: #fffaf0; border: 1px solid #c9a24b;
    outline: 4px solid #fffaf0; outline-offset: -9px;
    border-radius: 6px; padding: 44px 32px;
    box-shadow: 0 14px 40px rgba(0,0,0,.35);
  }
  .star { color: #c9a24b; font-size: 28px; letter-spacing: 10px; }
  h1 { font-family: "Playfair Display", Georgia, serif; color: #8c1c24; font-size: 36px; line-height: 1.15; margin: 8px 0 12px; }
  p { margin: 0 0 12px; }
  .when { font-weight: 600; color: #14254a; }
  a { color: #1f4a33; font-weight: 600; }
</style>
</head>
<body>
  <main class="card">
    <div class="star" aria-hidden="true">★★★</div>
    <h1>Thank you, your booking is in</h1>
    <p>We have your places and main course choices.</p>
    <p class="when">Saturday 5th December, dinner at 7:30pm<br>Templepatrick War Memorial Orange Hall</p>
    <p>We look forward to seeing you.</p>
    <p><a href="/christmas-dinner/">Make another booking</a></p>
  </main>
</body>
</html>
